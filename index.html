<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Woordwerk: leer woordjes, grammatica en werkwoorden voor al je talen." />
    <meta name="theme-color" content="#F2F7F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1714" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Woordwerk</title>
    <script>
      // Zet het thema meteen, zodat de pagina niet eerst wit flitst.
      (function () {
        try {
          var keuze = JSON.parse(localStorage.getItem('woordwerk-instellingen') || '{}').state?.thema || 'systeem';
          var donker = keuze === 'donker' || (keuze === 'systeem' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = donker ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
